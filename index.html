<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="DronePoint Plans">
<meta name="theme-color" content="#0f1315">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Field Plans — DronePoint</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: phone-first single column. Sticky map + readout on top, mission tabs, tap-to-fly shot cards, launch checklist. */
:root{
  --bg:#eef0ec; --card:#ffffff; --ink:#111618; --muted:#4f5a5e; --rule:#cfd5d2; --chip:#e4e8e5;
  --photo:#d9480f; --orbit:#00b8d4; --video:#00b8d4; --thermal:#e0218a; --map:#6a55d6; --rec:#e03131;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1315;--card:#1a2023;--ink:#eef1ef;--muted:#a7b1b4;--rule:#323b3f;--chip:#242c30;--photo:#ff7a3d;--orbit:#2fd8f0;--video:#2fd8f0;--thermal:#ff4fb0;--map:#9a8cff;--rec:#ff6b6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1315;--card:#1a2023;--ink:#eef1ef;--muted:#a7b1b4;--rule:#323b3f;--chip:#242c30;--photo:#ff7a3d;--orbit:#2fd8f0;--video:#2fd8f0;--thermal:#ff4fb0;--map:#9a8cff;--rec:#ff6b6b;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:520px;margin:0 auto;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:12px 40px}
header{display:grid;gap:2px;padding:4px 2px 10px}
.eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;font-size:12px;color:var(--muted)}
h1{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.05;margin:0}
.meta{font-family:var(--mono);font-size:12px;color:var(--muted)}
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:8px}
.mapwrap{border-radius:12px;overflow:hidden;border:1px solid var(--rule);background:#22292c}
.mapwrap svg{display:block;width:100%;height:auto;touch-action:manipulation}
.hud{display:flex;align-items:center;gap:8px;min-height:36px;background:var(--card);border:1px solid var(--rule);border-radius:10px;margin-top:6px;padding:4px 10px;font-size:15px}
.hud .alt{margin-left:auto;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.bar{height:4px;background:var(--chip);border-radius:2px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:var(--ink)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:8px;background:var(--chip);padding:4px;border-radius:12px}
.tabs button{font:700 15px var(--display);letter-spacing:.04em;text-transform:uppercase;border:0;background:transparent;color:var(--muted);padding:9px 2px;border-radius:9px;cursor:pointer;min-height:44px}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:inset 0 -3px 0 var(--c)}
.tabs button:focus-visible,.card:focus-visible,.fly:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.panel{display:grid;gap:10px;margin-top:6px}
.mhead{display:flex;align-items:center;gap:10px}
.mhead h2{font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase;margin:0;letter-spacing:.02em}
.mnote{color:var(--muted);font-size:14px;margin:0}
.fly{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;border:0;border-radius:12px;background:var(--c);color:#0d1b1e;font:700 18px var(--display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.card{background:var(--card);border:1px solid var(--rule);border-left:6px solid var(--c);border-radius:12px;padding:12px;display:grid;gap:8px;cursor:pointer;text-align:left;width:100%;color:inherit;font:inherit}
.card.on{outline:3px solid var(--c);outline-offset:-1px}
.crow{display:flex;align-items:center;gap:10px}
.id{font:700 14px var(--mono);min-width:38px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--c);color:#0d1b1e}
.ct{font-weight:700;font-size:17px;line-height:1.2;min-width:0}
.play{margin-left:auto;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--chip);flex:none}
.specs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.spec{background:var(--chip);border-radius:8px;padding:6px 8px;min-width:0}
.spec b{display:block;font:700 14px var(--mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.spec span{font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;font-size:11px;color:var(--muted)}
.why{font-size:14px;color:var(--muted);margin:0}
details.wps summary{font:600 13px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer;padding:4px 0}
.wtab{width:100%;border-collapse:collapse;font-size:13px}
.wtab td{padding:5px 4px;border-top:1px solid var(--rule);font-family:var(--mono);font-variant-numeric:tabular-nums;vertical-align:top}
.wtab td:first-child{font-weight:700}
.act{font:700 11px var(--mono);padding:1px 5px;border-radius:4px;white-space:nowrap}
.act.s{background:var(--rec);color:#fff}.act.x{border:1.5px solid var(--rec);color:var(--rec)}
.sect{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;margin-top:14px}
.sect h3{font-family:var(--display);font-weight:700;font-size:19px;text-transform:uppercase;margin:0 0 8px}
.sun{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.sun div{background:var(--chip);border-radius:8px;padding:6px}
.sun b{display:block;font:700 15px var(--mono)}
.sun span{font-family:var(--display);text-transform:uppercase;font-size:11px;letter-spacing:.08em;color:var(--muted)}
.check{display:grid;gap:4px}
.check label{display:flex;gap:10px;align-items:flex-start;padding:8px 2px;border-top:1px solid var(--rule);font-size:15px;min-height:44px}
.check label:first-child{border-top:0}
.check input{width:22px;height:22px;flex:none;accent-color:var(--ink);margin-top:1px}
.check label:has(input:checked) span{color:var(--muted);text-decoration:line-through}
.foot{font-size:12px;color:var(--muted);margin-top:12px}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 0 6px}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 4px;color:var(--muted);text-decoration:none;font:700 15px var(--display);letter-spacing:.06em;text-transform:uppercase}
.back:active{color:var(--ink)}
.offline{font:600 12px var(--mono);color:var(--muted)}
.sites{display:grid;gap:10px;margin-top:10px}
.site{display:block;background:var(--card);border:1px solid var(--rule);border-left:6px solid var(--photo);border-radius:12px;padding:14px;text-decoration:none;color:var(--ink)}
.site:active{background:var(--chip)}
.site b{display:block;font:700 20px var(--display);text-transform:uppercase;letter-spacing:.02em}
.site span{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.reset{margin-top:10px;background:none;border:1px solid var(--rule);color:var(--muted);border-radius:10px;min-height:44px;padding:0 14px;font:600 14px var(--body);cursor:pointer}
.blk{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--rule)}
.blk:first-of-type{border-top:0}
.blk .t{font:700 13px var(--mono);font-variant-numeric:tabular-nums}
.blk .n{font-weight:700}
.blk .d{color:var(--muted);font-size:14px}
.tg{display:inline-block;font:700 12px var(--mono);padding:1px 6px;border-radius:4px;margin:4px 4px 0 0;color:#0d1b1e;background:var(--c)}
.err{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:14px;margin-top:10px}

</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" id="back" href="https://dronepoint9.github.io">&lsaquo; Hub</a>
    <span class="offline" id="offline"></span>
  </div>

  <div id="listView" hidden>
    <header>
      <div class="eyebrow">DronePoint, LLC</div>
      <h1>Field Plans</h1>
      <div class="meta">Shot plans and checklists for each site</div>
    </header>
    <div class="sites" id="sites"></div>
  </div>

  <div id="planView" hidden>
    <header>
      <div class="eyebrow">DronePoint · Field plan</div>
      <h1 id="title"></h1>
      <div class="meta" id="meta"></div>
    </header>
    <div class="sticky">
      <div class="mapwrap"><svg id="map" role="img" aria-label="Site aerial with flight paths for the selected mission"></svg></div>
      <div class="hud" aria-live="polite"><span id="hudTxt"><b>Tap a shot to fly it</b></span><span class="alt" id="hudAlt"></span></div>
      <div class="bar"><i id="bar"></i></div>
      <div class="tabs" role="tablist" id="tabs"></div>
    </div>
    <div class="panel" id="panel" role="tabpanel"></div>

    <div class="sect">
      <h3>Light today</h3>
      <div class="sun" id="sun"></div>
      <p class="why" id="sunNote" style="margin-top:8px"></p>
    </div>

    <div class="sect">
      <h3>Day plan</h3>
      <div id="blocks"></div>
    </div>

    <div class="sect">
      <h3>Before you launch</h3>
      <div class="check" id="check"></div>
      <button class="reset" id="resetCheck" type="button">Clear checklist</button>
    </div>
    <p class="foot" id="foot"></p>
  </div>

  <div id="errView" class="err" hidden></div>
</div>

<script>
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const siteId=(params.get("site")||"").replace(/[^a-z0-9-]/gi,"");

// ---------- sun (NOAA / Meeus sunrise equation, good to about a minute) ----------
function sunTimes(lat,lon,y,m,d){
  const rad=Math.PI/180, JD=Date.UTC(y,m-1,d,12)/86400000+2440587.5, n=Math.round(JD-2451545.0+0.0008);
  const lw=lon, Js=n-lw/360, M=(357.5291+0.98560028*Js)%360, C=1.9148*Math.sin(M*rad)+0.02*Math.sin(2*M*rad)+0.0003*Math.sin(3*M*rad);
  const lam=(M+C+180+102.9372)%360, Jt=2451545.0+Js+0.0053*Math.sin(M*rad)-0.0069*Math.sin(2*lam*rad);
  const dec=Math.asin(Math.sin(lam*rad)*Math.sin(23.4397*rad));
  const cw=(Math.sin(-0.833*rad)-Math.sin(lat*rad)*Math.sin(dec))/(Math.cos(lat*rad)*Math.cos(dec));
  const w0=Math.acos(Math.max(-1,Math.min(1,cw)))/rad, toMs=j=>(j-2440587.5)*86400000;
  return {rise:toMs(Jt-w0/360),noon:toMs(Jt),set:toMs(Jt+w0/360)};
}
const TZ="America/New_York";
const fmtT=ms=>new Intl.DateTimeFormat("en-US",{timeZone:TZ,hour:"numeric",minute:"2-digit",hour12:true}).format(new Date(ms)).replace(" AM","").replace(" PM","");
const tzName=ms=>new Intl.DateTimeFormat("en-US",{timeZone:TZ,timeZoneName:"short"}).formatToParts(new Date(ms)).find(p=>p.type==="timeZoneName").value;
function renderSun(plan){
  const parts=new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date()).split("-").map(Number);
  const t=sunTimes(plan.lat,plan.lon,parts[0],parts[1],parts[2]), gold0=t.set-40*60000;
  $("sun").innerHTML=[["Sunrise",fmtT(t.rise)],["Golden",fmtT(gold0)],["Sunset",fmtT(t.set)],["Noon",fmtT(t.noon)]].map(([l,v])=>`<div><span>${l}</span><b>${v}</b></div>`).join("");
  const tomorrow=t.noon+86400000, change=tzName(t.noon)!==tzName(tomorrow);
  $("sunNote").textContent=(plan.light_note||"")+" Times are "+tzName(t.noon)+", computed for today."+(change?" Clocks change tonight, so tomorrow's times shift an hour.":"");
}

// ---------- offline status ----------
function showOnline(){ $("offline").textContent=navigator.onLine?"":"Offline"; }
addEventListener("online",showOnline);addEventListener("offline",showOnline);showOnline();
if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}

// ---------- routing ----------
function fail(msg){["listView","planView"].forEach(i=>$(i).hidden=true);$("errView").hidden=false;$("errView").innerHTML=msg}
async function getJSON(u){const r=await fetch(u,{cache:"no-cache"});if(!r.ok)throw new Error(u+" "+r.status);return r.json()}

(async function boot(){
  try{
    if(!siteId){
      const data=await getJSON("sites.json");
      $("listView").hidden=false;
      $("sites").innerHTML=data.sites.map(s=>`<a class="site" href="?site=${encodeURIComponent(s.id)}"><b>${esc(s.title)}</b><span>${esc(s.address||"")}</span><span>${esc(s.desc||"")}</span></a>`).join("");
      return;
    }
    $("back").href="./";$("back").innerHTML="&lsaquo; Sites";
    let base="sites/"+siteId+"/", plan;
    try{ plan=await getJSON(base+"plan.json"); }
    catch(e){ base=""; plan=await getJSON("plan.json"); }
    $("planView").hidden=false;
    document.title=plan.title+" — DronePoint";
    startPlan(plan,base);
  }catch(e){
    console.error('plans boot',e&&e.stack||e);
    fail("<b>Could not load this plan.</b><p class=\"why\">If you are offline, open it once with signal so it saves to this phone. <a href=\"./\">Back to sites</a></p>");
  }
})();

function startPlan(plan,base){
$("title").textContent=plan.title;
$("meta").textContent=plan.address+" · "+plan.lat+", "+plan.lon;
$("foot").textContent=plan.footnote||"";
const IW=plan.imageSize[0],IH=plan.imageSize[1],SITE=base+plan.image,HOME=plan.home,TBD=plan.tbdFt||250;
$("map").setAttribute("viewBox","0 0 "+IW+" "+IH);
const COLORS={photo:["var(--photo)","#ff6a2a"],orbit:["var(--orbit)","#2fd8f0"],video:["var(--video)","#2fd8f0"],thermal:["var(--thermal)","#ff4fb0"],map:["var(--map)","#a596ff"]};
const MISSIONS=plan.missions.map(m=>({...m,c:COLORS[m.color][0],hex:COLORS[m.color][1]}));
const S=JSON.parse(JSON.stringify(plan.shots));
Object.values(S).forEach(s=>{s.alt=s.alt.map(v=>v==="TBD"?TBD:v)});
const missionOf=id=>MISSIONS.find(m=>m.shots.includes(id));

// ---------- map ----------
const NS="http://www.w3.org/2000/svg",svg=document.getElementById("map");
const h=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e};
h("image",{href:SITE,x:0,y:0,width:IW,height:IH,preserveAspectRatio:"none"});
h("rect",{width:IW,height:IH,fill:"rgba(10,18,20,.22)"});
const defs=h("defs",{});
const staticG=h("g",{}),trailG=h("g",{}),markG=h("g",{}),fxG=h("g",{});
function arrowFor(hex){const id="a"+hex.slice(1);if(!document.getElementById(id)){const m=h("marker",{id,viewBox:"0 0 10 10",refX:6,refY:5,markerWidth:4,markerHeight:4,orient:"auto"},defs);h("path",{d:"M0,0 L10,5 L0,10z",fill:hex},m)}return`url(#${id})`}
const halo=(d,hex,w,dash,g)=>{h("path",{d,fill:"none",stroke:"#0b1214","stroke-width":w+5,"stroke-opacity":.6,"stroke-linecap":"round"},g);return h("path",{d,fill:"none",stroke:hex,"stroke-width":w,"stroke-dasharray":dash||"","stroke-linecap":"round"},g)};
const gridPts=(r,l)=>{const[x,y,w,hh]=r,p=[];for(let i=0;i<=l;i++){const xx=x+i*w/l;i%2?p.push([xx,y+hh],[xx,y]):p.push([xx,y],[xx,y+hh])}return p};
const ellPt=(s,t)=>[s.c[0]+s.a*Math.cos(t),s.c[1]+s.b*Math.sin(t)];
function drawStatic(id,hex){const s=S[id];const g=h("g",{},staticG);
  if(s.type==="still"){const[x,y]=s.pos,[ax,ay]=s.aim,a=Math.atan2(ay-y,ax-x),L=120,w=.38;h("path",{d:`M${x},${y} L${x+L*Math.cos(a-w)},${y+L*Math.sin(a-w)} A${L},${L} 0 0 1 ${x+L*Math.cos(a+w)},${y+L*Math.sin(a+w)}Z`,fill:hex,"fill-opacity":.3,stroke:hex,"stroke-width":3},g)}
  if(s.type==="nadir"){h("rect",{x:s.pos[0]-150,y:s.pos[1]-110,width:300,height:220,fill:"none",stroke:hex,"stroke-width":4,"stroke-dasharray":"14 9"},g)}
  if(s.type==="context"){[[0,-1],[1,0],[0,1],[-1,0]].forEach(([dx,dy])=>{const d=`M${s.pos[0]+dx*30},${s.pos[1]+dy*30} L${s.pos[0]+dx*70},${s.pos[1]+dy*70}`;h("path",{d,stroke:hex,"stroke-width":6,"marker-end":arrowFor(hex)},g)})}
  if(s.type==="line"){halo(`M${s.p} L${s.q}`,hex,7,"",g).setAttribute("marker-end",arrowFor(hex))}
  if(s.type==="rise"){[26,40].forEach(r=>h("circle",{cx:s.pos[0],cy:s.pos[1],r,fill:"none",stroke:hex,"stroke-width":4},g))}
  if(s.type==="ellipse"){halo(`M${s.c[0]-s.a},${s.c[1]} A${s.a},${s.b} 0 1 1 ${s.c[0]+s.a},${s.c[1]} A${s.a},${s.b} 0 1 1 ${s.c[0]-s.a},${s.c[1]}`,hex,6,"16 10",g);
    [1.25,1.75,.25,.75].forEach((k,i)=>{const[x,y]=ellPt(s,k*Math.PI);h("circle",{cx:x,cy:y,r:17,fill:"#0b1214",stroke:hex,"stroke-width":3},g);const t=h("text",{x,y:y+6,"text-anchor":"middle","font-family":"JetBrains Mono,monospace","font-weight":700,"font-size":16,fill:"#fff"},g);t.textContent="A"+(i+1)});
    poiMark(s.c,g)}
  if(s.type==="arc"){halo(`M${s.p0} A${s.r},${s.r} 0 0 1 ${s.p1}`,hex,7,"",g).setAttribute("marker-end",arrowFor(hex));poiMark(s.c,g)}
  if(s.type==="grid"){halo("M"+gridPts(s.rect,s.legs).join(" L"),hex,4,"",g)}
}
function poiMark(p,g){h("circle",{cx:p[0],cy:p[1],r:14,fill:"none",stroke:"#fff","stroke-width":3.5},g);h("path",{d:`M${p[0]-22},${p[1]}h44M${p[0]},${p[1]-22}v44`,stroke:"#fff","stroke-width":3},g)}
function startPt(s){return s.type==="line"?s.p:s.type==="arc"?s.p0:s.type==="ellipse"?ellPt(s,1.25*Math.PI):s.type==="grid"?gridPts(s.rect,s.legs)[0]:s.pos}
function drawMarker(id,hex){const s=S[id],[x,y]=s.type==="ellipse"?ellPt(s,0):startPt(s);const g=h("g",{"data-id":id,style:"cursor:pointer"},markG);
  h("circle",{cx:x,cy:y,r:26,fill:"#fff",stroke:hex,"stroke-width":6},g);const t=h("text",{x,y:y+8,"text-anchor":"middle","font-family":"Barlow Condensed,sans-serif","font-weight":700,"font-size":24,fill:"#111618"},g);t.textContent=id;
  g.addEventListener("click",()=>playShot(id))}
// home
function drawHome(){h("circle",{cx:HOME[0],cy:HOME[1],r:20,fill:"#111618",stroke:"#fff","stroke-width":4},markG);const t=h("text",{x:HOME[0],y:HOME[1]+8,"text-anchor":"middle","font-family":"Barlow Condensed,sans-serif","font-weight":700,"font-size":22,fill:"#fff"},markG);t.textContent="H"}
// north arrow
const na=h("g",{transform:`translate(${IW-49},52)`});h("circle",{r:30,fill:"rgba(255,255,255,.92)"},na);h("path",{d:"M0,-20 L10,13 L0,6 L-10,13Z",fill:"#111618"},na);

// drone
const drone=h("g",{style:"pointer-events:none;display:none"});
const cone=h("path",{d:"M0,0 L95,-36 A100,100 0 0 1 95,36Z","fill-opacity":.35,"stroke-width":2},drone);
h("path",{d:"M-15,-15 L15,15 M-15,15 L15,-15",stroke:"#0b1214","stroke-width":6},drone);
[[-15,-15],[15,-15],[-15,15],[15,15]].forEach(([x,y])=>h("circle",{cx:x,cy:y,r:9,fill:"rgba(255,255,255,.92)",stroke:"#0b1214","stroke-width":3},drone));
const body=h("circle",{r:8,stroke:"#0b1214","stroke-width":3},drone);

// ---------- motion ----------
const lerp=(a,b,u)=>a+(b-a)*u, ease=u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2, ang=(a,b)=>Math.atan2(b[1]-a[1],b[0]-a[0]);
function poly(pts,u){let L=[],T=0;for(let i=1;i<pts.length;i++){const l=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);L.push(l);T+=l}let d=u*T;
  for(let i=0;i<L.length;i++){if(d<=L[i]||i===L.length-1){const k=L[i]?Math.min(1,d/L[i]):0;return{x:lerp(pts[i][0],pts[i+1][0],k),y:lerp(pts[i][1],pts[i+1][1],k),h:ang(pts[i],pts[i+1]),i}}d-=L[i]}}
function motion(id){const s=S[id],[a0,a1]=s.alt;
  switch(s.type){
   case "still":{const a=ang(s.pos,s.aim);return{dur:2,flashes:[.6],f:u=>({x:s.pos[0],y:s.pos[1],h:a-.8*(1-ease(Math.min(1,u/.45))),alt:a0})}}
   case "nadir":return{dur:1.8,flashes:[.55],f:u=>({x:s.pos[0],y:s.pos[1],h:-Math.PI/2,alt:a0,nadir:true})};
   case "context":return{dur:3.6,flashes:[.15,.4,.65,.9],f:u=>({x:s.pos[0],y:s.pos[1],h:-Math.PI/2+Math.floor(Math.min(u,.999)*4)*Math.PI/2,alt:a0})};
   case "line":return{dur:3.2,flashes:s.flashes||[],f:u=>{const e=ease(u);return{x:lerp(s.p[0],s.q[0],e),y:lerp(s.p[1],s.q[1],e),h:s.fixedHd!=null?(s.fixedHd-90)*Math.PI/180:s.back?ang(s.q,s.p):ang(s.p,s.q),alt:lerp(a0,a1,e)}}};
   case "rise":return{dur:3.2,f:u=>({x:s.pos[0],y:s.pos[1],h:-Math.PI/2+u*.35,alt:lerp(a0,a1,ease(u)),nadir:true})};
   case "ellipse":return{dur:10,f:u=>{const t=1.25*Math.PI+u*2*Math.PI,[x,y]=ellPt(s,t);return{x,y,h:Math.atan2(s.c[1]-y,s.c[0]-x),alt:a0}}};
   case "arc":return{dur:2.8,f:u=>{const t=Math.PI/2+ease(u)*Math.PI/2;return{x:s.c[0]+s.r*Math.cos(t),y:s.c[1]+s.r*Math.sin(t),h:t+Math.PI,alt:a0}}};
   case "grid":{const pts=gridPts(s.rect,s.legs);return{dur:7,poly:pts,f:u=>{const q=poly(pts,u);return{...q,alt:a0,nadir:!!s.nadir}}}}
  }}
let seq=[],t=0,total=0,playing=false,last=0,fx=[],curId=null;
function build(ids,withHome){const out=[];let cur=HOME.slice(),ca=0;
  const tr=(to,alt)=>{const f=cur.slice(),fa=ca,d=Math.hypot(to[0]-f[0],to[1]-f[1]),hd=ang(f,to);out.push({dur:Math.max(.5,d/320),f:u=>{u=ease(u);return{x:lerp(f[0],to[0],u),y:lerp(f[1],to[1],u),h:hd,alt:lerp(fa,alt,u)}}});cur=to.slice();ca=alt};
  ids.forEach(id=>{const m=motion(id);m.id=id;const st=m.f(0);if(withHome)tr([st.x,st.y],st.alt);out.push(m);const e=m.f(1);cur=[e.x,e.y];ca=e.alt});
  if(withHome){tr(HOME,0);out.push({dur:.6,land:true,f:()=>({x:HOME[0],y:HOME[1],h:-Math.PI/2,alt:0})})}
  if(withHome){/* prepend takeoff hop is the first transit */}
  return out}
function setTrails(){trailG.innerHTML="";seq.forEach(s=>{const hex=s.id?missionOf(s.id).hex:"#e8eef0";s.pl=h("polyline",{points:"",fill:"none",stroke:hex,"stroke-width":s.id?6:3,"stroke-dasharray":s.id?"":"8 9","stroke-linecap":"round","stroke-linejoin":"round"},trailG)})}
const hudTxt=document.getElementById("hudTxt"),hudAlt=document.getElementById("hudAlt"),bar=document.getElementById("bar");
function altLabel(id,a){const s=id&&S[id];if(s&&s.tbd&&a>122.5)return"122 ft + rise (TBD)";return Math.round(a)+" ft"}
function draw(){let acc=0,i=0;while(i<seq.length-1&&acc+seq[i].dur<=t){acc+=seq[i].dur;i++}
  const sg=seq[i],u=Math.min(1,Math.max(0,(t-acc)/sg.dur)),st=sg.f(u);
  seq.forEach((s,k)=>{let uu=k<i?1:k===i?u:0;if(uu<=0){s.pl.setAttribute("points","");return}
    if(s.poly){const q=s.f(uu),v=s.poly.slice(0,q.i+1).map(p=>p.join(","));v.push(q.x+","+q.y);s.pl.setAttribute("points",v.join(" "));return}
    const n=Math.max(2,Math.round(uu*50)),pp=[];for(let j=0;j<=n;j++){const q=s.f(uu*j/n);pp.push(q.x.toFixed(1)+","+q.y.toFixed(1))}s.pl.setAttribute("points",pp.join(" "))});
  const hex=sg.id?missionOf(sg.id).hex:"#ffffff",sc=.8+st.alt/400*.7;
  drone.style.display="";drone.setAttribute("transform",`translate(${st.x},${st.y}) rotate(${st.h*180/Math.PI}) scale(${sc})`);
  cone.setAttribute("fill",hex);cone.setAttribute("stroke",hex);body.setAttribute("fill",hex);cone.style.display=st.nadir?"none":"";
  (sg.flashes||[]).forEach((f,k)=>{if(u>=f&&!sg["f"+k]){sg["f"+k]=1;fx.push({t0:performance.now(),el:h("circle",{cx:st.x,cy:st.y,r:6,fill:"none",stroke:"#fff","stroke-width":6},fxG)})}});
  if(sg.id!==curId){curId=sg.id;markCard(sg.id)}
  hudTxt.innerHTML=sg.land?"<b>Landed</b>":sg.id?`<b>${sg.id}</b> ${esc(S[sg.id].t)}`:"<b>Repositioning</b>";
  hudAlt.textContent=sg.land?"":altLabel(sg.id,st.alt);
  bar.style.width=(t/total*100)+"%"}
function frame(now){if(!playing)return;const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;
  fx=fx.filter(f=>{const k=(now-f.t0)/500;if(k>=1){f.el.remove();return false}f.el.setAttribute("r",6+k*55);f.el.setAttribute("stroke-opacity",1-k);return true});
  if(t>=total){t=total;draw();playing=false;return}draw();requestAnimationFrame(frame)}
function run(q){playing=false;fx.forEach(f=>f.el.remove());fx=[];seq=q;seq.forEach(s=>Object.keys(s).forEach(k=>{if(/^f\d+$/.test(k))delete s[k]}));total=seq.reduce((a,s)=>a+s.dur,0);t=0;curId=undefined;setTrails();playing=true;last=performance.now();requestAnimationFrame(frame)}
function playShot(id){if(missionOf(id).key!==active.key)selectTab(missionOf(id).key);run(build([id],false))}
function playMission(m){run(build(m.shots,true))}

// ---------- UI ----------
const tabs=document.getElementById("tabs"),panel=document.getElementById("panel");let active=MISSIONS[0];tabs.innerHTML="";
MISSIONS.forEach(m=>{const b=document.createElement("button");b.role="tab";b.id="tab-"+m.key;b.textContent=m.tab;b.style.setProperty("--c",m.c);b.setAttribute("aria-selected","false");b.addEventListener("click",()=>selectTab(m.key));tabs.appendChild(b)});
function markCard(id){panel.querySelectorAll(".card").forEach(c=>c.classList.toggle("on",c.dataset.id===id))}
const playIcon='<svg width="14" height="14" viewBox="0 0 12 12"><path d="M2 1 L11 6 L2 11Z" fill="currentColor"/></svg>';
function selectTab(key){active=MISSIONS.find(m=>m.key===key);playing=false;drone.style.display="none";trailG.innerHTML="";fxG.innerHTML="";bar.style.width="0";
  tabs.querySelectorAll("button").forEach(b=>b.setAttribute("aria-selected",b.id==="tab-"+key));
  staticG.innerHTML="";markG.innerHTML="";active.shots.forEach(id=>drawStatic(id,active.hex));drawHome();active.shots.forEach(id=>drawMarker(id,active.hex));
  hudTxt.innerHTML=`<b>${esc(active.name)}</b>`;hudAlt.textContent=active.shots.length+(active.shots.length>1?" shots":" shot");
  panel.style.setProperty("--c",active.c);
  panel.innerHTML=`<div class="mhead"><h2>${esc(active.name)}</h2></div><p class="mnote">${esc(active.note)}</p>
   <button class="fly" id="flyBtn" style="--c:${active.c}">${playIcon} Fly ${active.shots.length>1?"full mission":"it"}</button>`+
   active.shots.map(id=>{const s=S[id];const altTxt=s.alt[0]===s.alt[1]?s.alt[0]+" ft":(s.alt[0]===TBD?"TBD":s.alt[0])+" → "+(s.alt[1]===TBD?"TBD":s.alt[1]);
    const w=s.wps?`<details class="wps" onclick="event.stopPropagation()"><summary>Waypoints</summary><table class="wtab">${s.wps.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])} ft</td><td>${esc(r[2])}</td><td>${r[3]==="S"?'<span class="act s">START</span>':r[3]==="X"?'<span class="act x">STOP</span>':""}</td></tr>`).join("")}</table></details>`:"";
    return`<div class="card" data-id="${id}" tabindex="0" role="button" aria-label="Fly ${id}, ${esc(s.t)}" style="--c:${active.c}">
     <div class="crow"><span class="id">${id}</span><span class="ct">${esc(s.t)}</span><span class="play" aria-hidden="true">${playIcon}</span></div>
     <div class="specs"><div class="spec"><span>Alt</span><b>${altTxt}</b></div><div class="spec"><span>Heading</span><b>${esc(s.hd)}</b></div><div class="spec"><span>Gimbal</span><b>${esc(s.gb)}</b></div>
     <div class="spec"><span>When</span><b>${esc(s.win)}</b></div><div class="spec" style="grid-column:span 2"><span>Aircraft</span><b>${esc(s.ac)}</b></div></div>
     <p class="why">${esc(s.why)}</p>${w}</div>`}).join("");
  document.getElementById("flyBtn").addEventListener("click",()=>playMission(active));
  panel.querySelectorAll(".card").forEach(c=>{c.addEventListener("click",()=>{playShot(c.dataset.id);document.querySelector(".sticky").scrollIntoView({block:"start",behavior:"smooth"})});c.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();playShot(c.dataset.id)}})});
}



selectTab(MISSIONS[0].key);

// day plan blocks
$("blocks").innerHTML=(plan.blocks||[]).map(([t,n,d,ids])=>`<div class="blk"><div class="t">${esc(t)}</div><div><div class="n">${esc(n)}</div><div class="d">${esc(d)}</div>${ids.map(i=>`<span class="tg" style="--c:${missionOf(i)?missionOf(i).hex:"#999"}">${esc(i)}</span>`).join("")}</div></div>`).join("");

// sun
renderSun(plan);

// checklist (remembered on this phone only, per site)
const KEY="plans-check-"+plan.id;let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const ck=$("check");
function buildCheck(){ck.innerHTML="";plan.checklist.forEach((txt,i)=>{const l=document.createElement("label");l.innerHTML=`<input type="checkbox" ${saved[i]?"checked":""}><span>${esc(txt)}</span>`;l.querySelector("input").addEventListener("change",e=>{saved[i]=e.target.checked;try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(_){}});ck.appendChild(l)})}
buildCheck();
$("resetCheck").addEventListener("click",()=>{saved={};try{localStorage.removeItem(KEY)}catch(_){}buildCheck()});
}
</script>
</body>
